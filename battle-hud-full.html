<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full Battle HUD</title>
  <style>
    :root {
      color-scheme: light;
      --panel: rgba(214, 240, 252, 0.94);
      --panel-strong: rgba(235, 249, 255, 0.96);
      --line: rgba(112, 177, 218, 0.78);
      --blue: #3e8fc3;
      --cream: #fff8e4;
      --brown: #8a6f43;
      --text: #2f2b24;
      --muted: #716a5c;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 8px;
    }

    .hud {
      width: min(100%, 1024px);
      height: 224px;
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(112, 177, 218, 0.92);
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(207, 236, 250, 0.98), rgba(235, 249, 255, 0.94)),
        var(--panel);
      box-shadow: 0 14px 34px rgba(50, 112, 154, 0.22);
      cursor: move;
    }

    .region {
      position: relative;
      display: grid;
      grid-template-columns: 126px 150px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 0;
      padding: 8px 14px 8px 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(197, 232, 249, 0.96), rgba(235, 249, 255, 0.9) 44%, rgba(255, 248, 228, 0.54)),
        var(--panel-strong);
    }

    .region::before {
      content: "";
      position: absolute;
      inset: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.72);
      pointer-events: none;
    }

    .avatar-stack {
      position: relative;
      z-index: 1;
      width: 112px;
      display: grid;
      justify-items: center;
      gap: 5px;
    }

    .avatar-box {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 248, 228, 0.96);
      border-radius: 10px;
      background:
        radial-gradient(circle at 42% 28%, rgba(255, 255, 255, 0.62), transparent 36%),
        linear-gradient(135deg, #bce7fb, #e9f8ff 52%, #fff8e4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82), 0 7px 16px rgba(50, 112, 154, 0.16);
    }

    .avatar {
      width: 58px;
      height: 58px;
      object-fit: contain;
      image-rendering: auto;
      filter: drop-shadow(0 3px 5px rgba(74, 55, 32, 0.2));
    }

    .avatar[hidden],
    .avatar-fallback[hidden] {
      display: none;
    }

    .avatar-fallback {
      color: rgba(77, 60, 17, 0.74);
      font-size: 22px;
      font-weight: 900;
    }

    .bench {
      width: 112px;
      height: 22px;
      display: grid;
      grid-template-columns: repeat(5, 20px);
      gap: 3px;
      justify-content: center;
      align-items: center;
    }

    .mini-avatar {
      width: 20px;
      height: 20px;
      object-fit: contain;
      border: 1px solid rgba(255, 248, 228, 0.9);
      border-radius: 5px;
      background:
        radial-gradient(circle at 42% 28%, rgba(255, 255, 255, 0.56), transparent 34%),
        linear-gradient(135deg, #bce7fb, #e9f8ff 58%, #fff8e4);
      box-shadow: 0 2px 5px rgba(50, 112, 154, 0.14);
    }

    .mini-avatar[hidden] {
      display: none;
    }

    .main {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 76px 176px minmax(232px, 1fr);
      gap: 8px;
      align-content: stretch;
    }

    .info-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: 20px 1fr;
      gap: 4px;
      padding: 8px 10px;
      overflow: hidden;
      border: 1px solid rgba(112, 177, 218, 0.5);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(235, 249, 255, 0.9), rgba(207, 236, 250, 0.72));
    }

    .info-title {
      display: inline-flex;
      align-items: center;
      color: #3e78a8;
      font-size: 12px;
      font-weight: 800;
    }

    .info-value {
      min-width: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.22;
      overflow: hidden;
      text-shadow: none;
    }

    .trait-panel {
      grid-template-rows: 1fr;
      align-items: center;
      justify-items: center;
      padding: 6px 8px;
    }

    .trait-panel .info-title {
      display: none;
    }

    .trait-panel .info-value {
      width: 100%;
      font-size: 14px;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .skill-panel {
      grid-template-rows: 1fr;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .skill-panel .info-title {
      display: none;
    }

    .skill-panel .buff-list {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(2, 112px);
      grid-auto-rows: 28px;
      justify-content: start;
      align-content: center;
      gap: 4px;
    }

    .buff-list {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }

    .buff-chip {
      max-width: 100%;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid rgba(234, 216, 181, 0.92);
      color: #4a3720;
      background: rgba(255, 247, 222, 0.88);
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .skill-chip {
      width: 112px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 5px 2px 3px;
      border-radius: 7px;
      border: 1px solid rgba(234, 216, 181, 0.92);
      color: #4a3720;
      background: rgba(255, 247, 222, 0.9);
      line-height: 1;
      overflow: hidden;
    }

    .skill-icon {
      position: relative;
      width: 48px;
      height: 22px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.55);
      color: #fffdf8;
    }

    .skill-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .skill-icon-label {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: 2px;
      padding: 1px 2px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(29, 26, 20, 0.72);
      color: #fff8e4;
      font-size: 8px;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skill-copy {
      min-width: 0;
      display: grid;
      align-items: center;
    }

    .skill-damage {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #8a6f43;
      font-size: 11px;
      font-weight: 900;
    }

    .stats {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 5px;
      align-content: center;
    }

    .stat-cell {
      height: 24px;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      overflow: hidden;
      border-radius: 7px;
      border: 1px solid rgba(112, 177, 218, 0.5);
      background: linear-gradient(135deg, rgba(235, 249, 255, 0.92), rgba(255, 248, 228, 0.5));
    }

    .stat-label {
      color: #716a5c;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stat-value {
      min-width: 0;
      color: #4a3720;
      font-size: 14px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    /* qk-full-hud-six-stats-skills-v40: compact six-dimensional stats; all remaining room belongs to skills. */
    .region {
      grid-template-columns: 110px 244px minmax(0, 1fr);
      gap: 10px;
    }

    .main {
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
      height: 100%;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, 18px);
      gap: 3px 4px;
    }

    .stats .stat-cell {
      height: 18px;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 4px;
      padding: 0 6px;
      border-radius: 5px;
    }

    .stats .stat-label {
      font-size: 9px;
    }

    .stats .stat-value {
      font-size: 12px;
    }

    .stats .stat-speed {
      grid-column: 1 / -1;
      grid-template-columns: 48px minmax(0, 1fr);
    }

    .skill-panel {
      width: 100%;
      height: 100%;
    }

    .skill-panel .buff-list {
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 24px;
      align-content: center;
      gap: 4px;
    }

    .skill-chip {
      width: 100%;
      height: 24px;
    }

    .skill-icon {
      height: 20px;
    }

    /* qk-full-hud-large-stable-skills-v41: larger skill cards and icons for the wider full HUD. */
    .skill-panel .buff-list {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 72px;
      gap: 4px 6px;
    }

    .skill-chip {
      height: 72px;
      gap: 4px;
      padding: 2px 4px 2px 3px;
      border-radius: 8px;
    }

    .skill-icon {
      width: 66px;
      height: 26px;
      flex-basis: 66px;
      border-radius: 6px;
    }

    .skill-icon-label {
      font-size: 11px;
    }

    .skill-damage {
      font-size: 13px;
    }
    .skill-chip {
      position: relative;
    }

    .skill-icon {
      position: relative;
      inset: auto;
      z-index: 1;
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
    }

    .skill-icon img {
      object-fit: cover;
      object-position: center;
    }

    .skill-icon-label {
      z-index: 1;
    }

    .skill-copy {
      min-width: 0;
      margin-left: auto;
    }

    .skill-damage {
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    /* qk-full-hud-shared-data-v42: four equal 72px square skill slots. */
  </style>
</head>
<body>
  <main class="hud" id="hud" data-qk-hud-panel="full" title="drag">
        <section class="region" data-side="my">
      <div class="avatar-stack">
        <div class="avatar-box">
          <img class="avatar" data-role="avatar" alt="" hidden />
          <div class="avatar-fallback" data-role="fallback">?</div>
        </div>
        <div class="bench" data-role="bench"></div>
      </div>
      <div class="stats" data-role="stats">
        <div class="stat-cell"><span class="stat-label">&#29983;&#21629;&#33539;&#22260;</span><span class="stat-value" data-stat="hpRange">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#24403;&#21069;&#34880;&#37327;</span><span class="stat-value" data-stat="currentHp">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#25915;</span><span class="stat-value" data-stat="phyAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#25915;</span><span class="stat-value" data-stat="magAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#38450;</span><span class="stat-value" data-stat="phyDef">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#38450;</span><span class="stat-value" data-stat="magDef">--</span></div>
        <div class="stat-cell stat-speed"><span class="stat-label">&#36895;&#24230;</span><span class="stat-value" data-stat="speed">--</span></div>
      </div>
      <div class="main">
        <div class="info-panel skill-panel">
          <div class="info-title">&#25216;&#33021;</div>
          <div class="buff-list" data-role="skills"></div>
        </div>
      </div>
    </section>
        <section class="region" data-side="enemy">
      <div class="avatar-stack">
        <div class="avatar-box">
          <img class="avatar" data-role="avatar" alt="" hidden />
          <div class="avatar-fallback" data-role="fallback">?</div>
        </div>
        <div class="bench" data-role="bench"></div>
      </div>
      <div class="stats" data-role="stats">
        <div class="stat-cell"><span class="stat-label">&#29983;&#21629;&#33539;&#22260;</span><span class="stat-value" data-stat="hpRange">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#24403;&#21069;&#34880;&#37327;</span><span class="stat-value" data-stat="currentHp">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#25915;</span><span class="stat-value" data-stat="phyAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#25915;</span><span class="stat-value" data-stat="magAtk">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#29289;&#38450;</span><span class="stat-value" data-stat="phyDef">--</span></div>
        <div class="stat-cell"><span class="stat-label">&#39764;&#38450;</span><span class="stat-value" data-stat="magDef">--</span></div>
        <div class="stat-cell stat-speed"><span class="stat-label">&#36895;&#24230;</span><span class="stat-value" data-stat="speed">--</span></div>
      </div>
      <div class="main">
        <div class="info-panel skill-panel">
          <div class="info-title">&#25216;&#33021;</div>
          <div class="buff-list" data-role="skills"></div>
        </div>
      </div>
    </section>
  </main>

  
<script>
(function(){
  function s(key){ try { return JSON.parse(localStorage.getItem("luoke.calc.v2")||"null") || {}; } catch(e){ return {}; } }
  var st = s();
  function pick(side){
    var x = st[side] || {};
    var slots = Array.isArray(x.slots) ? x.slots : [];
    var idx = Number.isInteger(x.active) ? x.active : 0;
    return { name: slots[idx] || slots[0] || (side === "mine" ? "我方" : "对手"), hp: x.hp, max: null, moves: x.moves || [] };
  }
  function fill(side, cssSide){
    var p = pick(side);
    var root = document.querySelector('[data-side="' + cssSide + '"]');
    if (!root) return;
    var fallback = root.querySelector('[data-role="fallback"]');
    if (fallback) fallback.textContent = (p.name || "?").slice(0,1);
    function set(k, v){ var el = root.querySelector('[data-stat="' + k + '"]'); if (el) el.textContent = v; }
    set("hpRange", p.max || "--");
    set("currentHp", p.hp == null ? "--" : String(p.hp));
    var list = root.querySelector('[data-role="skills"]');
    if (list) {
      list.innerHTML = "";
      (Array.isArray(p.moves) ? p.moves : []).forEach(function(n){
        if (!n) return;
        var d = document.createElement("div");
        d.className = "skill-chip";
        d.innerHTML = "<span class='skill-icon'><span class='skill-icon-label'>" + n + "</span></span><span class='skill-copy'><span class='skill-damage'>" + n + "</span></span>";
        list.appendChild(d);
      });
    }
  }
  fill("mine", "my"); fill("foe", "enemy");
})();
</script>
